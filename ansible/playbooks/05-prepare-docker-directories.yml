- name: Prepare Docker directories
  hosts: homelab
  become: true

  tasks:
    - name: Create Docker base directory
      ansible.builtin.file:
        path: "{{ docker_base_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create Docker data directory
      ansible.builtin.file:
        path: "{{ docker_data_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Create service directories
      ansible.builtin.file:
        path: "{{ docker_base_path }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ docker_services }}"

    - name: Create common data directories
      ansible.builtin.file:
        path: "{{ docker_data_path }}/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - nextcloud
        - adguard-home
        - nginx-proxy-manager
        - monitoring
        - monitoring/prometheus
        - monitoring/grafana
        - uptime-kuma
