- name: Fix permissions for service data directories
  hosts: homelab
  become: true

  tasks:
    - name: Ensure Prometheus data directory exists
      ansible.builtin.file:
        path: "{{ docker_data_path }}/monitoring/prometheus"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0755"
        recurse: true

    - name: Ensure Grafana data directory exists
      ansible.builtin.file:
        path: "{{ docker_data_path }}/monitoring/grafana"
        state: directory
        owner: "472"
        group: "472"
        mode: "0755"
        recurse: true

    - name: Ensure Uptime Kuma data directory exists
      ansible.builtin.file:
        path: "{{ docker_data_path }}/uptime-kuma"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
        recurse: true
